<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="topHeader" th:fragment="header(currentPage)">
    <div class="topBar">
        <div class="inner">
            <div class="brand">
                <div class="logo-header">
                    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.5-1 2-2h2v-4h-2c0-1-.5-1.5-1-2h0V5z"/>
                    </svg>
                </div>
                <a class="brandText" th:href="@{/stock}">Stoxle</a>
            </div>


            <div class="menu">
                <th:block th:if="${session.loginUser == null}">
                    <a th:href="@{/login}" class="menuBtn menuBtnOutline">로그인</a>
                    <a th:href="@{/register}" class="menuBtn menuBtnFill">회원가입</a>
                </th:block>

                <th:block th:if="${session.loginUser != null}">
                    <span class="userText"
                          th:text="${#strings.arraySplit(session.loginUser, '@')[0]} + '님'"></span>
                    <a th:href="@{/logout}" class="menuBtn menuBtnOutline">로그아웃</a>
                    <a th:href="@{/mypage}" class="menuBtn menuBtnFill">마이페이지</a>
                </th:block>
            </div>
        </div>
    </div>

    <div class="categoryBar">
        <div class="inner categoryInner">
            <ul class="categoryMenu">
                <li>
                    <a th:href="@{/news}"
                       th:classappend="${currentPage == 'news'} ? 'active' : ''">뉴스</a>
                </li>
                <li>
                    <a th:href="@{/community}"
                       th:classappend="${currentPage == 'community'} ? 'active' : ''">커뮤니티</a>
                </li>
                <li>
                    <a th:href="@{/asset/dashboard}"
                       th:classappend="${currentPage == 'asset/dashboard'} ? 'active' : ''">자산 관리</a>
                </li>
                <li>
                    <a th:href="@{/mypage}"
                       th:classappend="${currentPage == 'mypage'} ? 'active' : ''">마이페이지</a>
                </li>
            </ul>
        </div>
    </div>
</header>

</body>
</html>
