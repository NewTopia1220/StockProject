<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${stockInfo.stockName}">주식 상세</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h1 th:text="${stockInfo.stockName}">종목명</h1>

<!-- 종목 현재가 정보 -->
<table>
  <tr><td>현재가</td><td id="currentPrice" th:text="${stockInfo.currentPrice}"></td></tr>
  <tr><td>시가</td><td id="openPrice" th:text="${stockInfo.openPrice}"></td></tr>
  <tr><td>고가</td><td id="highPrice" th:text="${stockInfo.highPrice}"></td></tr>
  <tr><td>저가</td><td id="lowPrice" th:text="${stockInfo.lowPrice}"></td></tr>
  <tr><td>거래량</td><td id="volume" th:text="${stockInfo.volume}"></td></tr>
</table>

<!-- 코스피 지수 -->
<div>
  <h2>KOSPI</h2>
  <span id="kospiPrice" th:text="${kospiInfo.currentPrice}"></span>
  <span> | 전일대비 </span>
  <span id="kospiChange" th:text="${kospiInfo.priceChange}"></span>
  <span> (</span>
  <span id="kospiRate" th:text="${kospiInfo.changeRate}"></span>
  <span>%)</span>
</div>


<!-- 차트 -->
<canvas id="priceChart"></canvas>
<canvas id="volumeChart"></canvas>

<script src="/js/chart.js"></script>

</body>
</html>
