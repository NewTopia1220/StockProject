kis.api.base-url=${KIS_BASE_URL}
exim.api.key=${EXIM_API_KEY:}

# Asset prediction API (optional)
asset.prediction.api-url=http://127.0.0.1:8000/api/asset/predict

# Shared project-local data paths used by predict.py and article_predict.py
ai.predict.sqlite=${user.dir}/python/ml/data/news_data.db
ai.predict.oracle-company=${user.dir}/python/ml/data/oracle_company.csv
ai.predict.oracle-sector=${user.dir}/python/ml/data/oracle_sector.csv

# Python executable path
# Use PYTHON_PATH first when each teammate has a different local virtualenv path.
# Fallback to the project root virtualenv, which is the preferred runtime for ML scripts.
python.path=${PYTHON_PATH:${user.dir}/.venv/Scripts/python.exe}

# Article-level impact model (fallback when DB impact is missing)
ai.article-impact.script=${user.dir}/python/ml/article_predict.py
ai.article-impact.model=${user.dir}/python/ml/article_lgbm_model.pkl
ai.predict.cache-seconds=600
ai.article-impact.cache-seconds=43200

# predict.py runtime files
ai.predict.script=${user.dir}/python/ml/predict.py
ai.predict.model=${user.dir}/python/ml/lgbm_model.pkl

# predict.py timeout seconds
ai.predict.timeout=30

